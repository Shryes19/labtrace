# Local databases for LabTrace:  docker compose up -d
#  - PostgreSQL on host port 5433 (5433 avoids a clash with a locally installed PostgreSQL)
#  - MongoDB 7 with a small cache (0.25 GB) so it also runs on low-memory laptops
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  mongodb:
    image: mongo:7
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]

volumes:
  pgdata:
  mongodata:

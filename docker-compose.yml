services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  mongodb:
    image: mongo:7
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]

volumes:
  pgdata:
  mongodata:
